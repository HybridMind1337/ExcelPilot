[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "excelpilot"
version = "0.1.0"
description = "Analyse Excel data and build professional dashboards from the command line."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "HybridMind1337" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "polars>=1.30.0",
    "pyarrow>=19.0.0",
    "duckdb>=1.2.0",
    "openpyxl>=3.1.5",
    "xlsxwriter>=3.2.0",
    "typer>=0.16.0",
    "rich>=14.0.0",
    "prompt-toolkit>=3.0.50",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "pyyaml>=6.0.2",
    "platformdirs>=4.3.0",
]

[project.urls]
Homepage = "https://github.com/HybridMind1337/ExcelPilot"
Repository = "https://github.com/HybridMind1337/ExcelPilot"
Issues = "https://github.com/HybridMind1337/ExcelPilot/issues"

[project.optional-dependencies]
forecast = [
    "scipy>=1.15.0",
    "statsmodels>=0.14.4",
]
ml = [
    "scikit-learn>=1.6.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.15.0",
    "ruff>=0.9.0",
    "pre-commit>=4.1.0",
    "pip-audit>=2.8.0",
    "types-pyyaml>=6.0.12.20241230",
    "types-openpyxl>=3.1.5.20241225",
]

[project.scripts]
excelpilot = "excelpilot.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/excelpilot"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501", # Line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["excelpilot"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
packages = ["excelpilot"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "xlsxwriter.*",
    "duckdb.*",
    "numpy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --basetemp=.pytest_temp --cov=excelpilot --cov-report=term-missing"

[tool.coverage.run]
source = ["src/excelpilot"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
